          <p id="page-subtitle">系统状态与最近活动</p>
        </div>
        <div class="topbar-actions">

            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-user"></use></svg>
            <span id="account-label">账号确认中…</span>
          </div>
          <span class="badge badge-mode" id="mode-badge" title="发布模式">模式 —</span>
          <span class="conn-pill connecting" id="conn-pill" title="本地客户端连接状态">
            <span class="dot"></span>
            <span id="conn-text">连接中</span>
          </span>
          <button class="btn btn-icon" id="refresh-btn" type="button" title="刷新当前页面" aria-label="刷新当前页面">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-refresh"></use></svg>
          </button>
        </div>
      </header>

    </div>
