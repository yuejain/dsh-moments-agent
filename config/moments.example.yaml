# DSH Moments Agent 配置示例
#
# 用法：把下面这段追加/合并到
#   C:\Users\<你>\.dsh\profiles\desktop\cordis.patch.yml
# 或在 DSH 插件管理页中编辑该插件行的 config。
#
# 注意：patch 层的 config 是“整行替换、不深合并”，这里只写需要覆盖的字段；
# 未写字段使用 src/config.ts 中的默认值（默认最保守：PREPARE_ONLY、无调度、无自动发布）。

- id: dsh-moments-agent
  name: dsh-moments-agent
  config:
    enabled: true
    # 插件数据目录：相对插件包根目录，或绝对路径
    dataDir: data
    # PREPARE_ONLY（默认，只准备图文，绝不发表）
    # APPROVAL_REQUIRED（审核通过且有有效一次性人工审批才可发表）
    # POLICY_AUTONOMOUS（审核通过后直接发表，无逐条人工审批）
    # EXE 设置页保存的三级模式优先于此默认值，并同步内置执行器权限。
    publishMode: PREPARE_ONLY
    killSwitch: false
    # 自主创作调度：默认关闭；按所选模式生成审核内容，第二档额外请求审批。
    # 发送由 policy.humanize.enabled 独立控制；第三档已审核内容可免审批自动发送。
    scheduleEnabled: false
    # manual（本机管理页审批）/ wechat（微信所有者命令）/ both
    ownerChannel: manual
    llm:
      provider: deepseek-account
      model: deepseek-flash
      reasoningEffort: high
      temperature: 0.8
      timeoutMs: 90000
    wechatAgent:
      enabled: false
      readerBaseUrl: http://127.0.0.1:11231
      hookBaseUrl: http://127.0.0.1:11230
      # 从 WeChatAgent 的 state/wechat-io-config.json 读取 reader_base_url/token（可选）
      readerConfigPath: null
      readerTokenFile: null
      hookTokenFile: null
      account: ''
      # 只有该 wxid 发送的 /moments 命令才会被接受
      ownerWxid: ''
      pollIntervalMs: 15000
    desktopExecutor:
      enabled: false
      baseUrl: http://127.0.0.1:18765
      tokenFile: null
      timeoutMs: 120000
    images:
      # 按顺序尝试；默认只有人工订阅桥与本地导入，不会产生付费调用
      providers:
        - manual-subscription
        - local-import
      officialApiEnabled: false
      allowNetworkSearch: false
      # 显式启用后，会将任务图片发送给上方配置的 DSH 模型进行语义审核/OCR。
      # 默认只做本地结构检查；启用时模型或附件服务不可用则拒绝图片。
      semanticReviewEnabled: false
      maxFileBytes: 12582912
      allowedAspectRatios: ['1:1', '4:3', '3:4', '16:9', '9:16']
      assetDir: assets
    policy:
      dailyLimit: 2
      minIntervalMinutes: 180
      quietHours: ['23:00', '08:00']
      requireApproval: true
      approvalTtlMinutes: 120
      minScoreToPublish: 0.62
      timeZone: Asia/Shanghai
      maxTextLength: 2000
      maxImages: 9
      # 拟人化自动发送：默认关闭。第二档要求有效审批，第三档接受已审核内容；
      # 两者均要求执行器允许、账号/内容/额度/时段检查通过；UNCERTAIN 永不自动重试。
      humanize:
        enabled: false
        delaySeconds: [90, 900]
        activeHours: ['09:00', '22:00']
        minIntervalSeconds: 3600
        jitterSeconds: 600
        maxPublishAttempts: 2
        backoffSeconds: [60, 180]
    scheduler:
      tickSeconds: 60
      ideaProbability: 0.05
      jitterSeconds: 0
    adminServer:
      # 本机管理页：http://127.0.0.1:18766/ ，令牌见 data/admin-token.txt
      enabled: false
      port: 18766
      tokenFile: null
    workspace:
      personaFile: persona/SOUL.md
      visualStyleFile: persona/VISUAL_STYLE.md
    # 社交记忆：只读 WeChatAgent「聊天范围」白名单内的会话，提炼人物印象，
    # 供朋友圈选题/创作弱参考。默认关闭；私聊需单独开启；真实昵称只存本地。
    chatMemory:
      enabled: false
      includePrivate: false
      conversations: []            # 会话名或 conversationKey；空 = 上游白名单内全部
      syncIntervalMinutes: 60
      maxMessagesPerConversation: 200
      retentionDays: 30            # 消息保留期（天）
      impressionTtlDays: 90        # 人物印象有效期（天）
      maxMembersPerConversation: 100
      anonymizeInPrompts: true     # 保留字段：实现始终匿名（提示词只用「群友A」等别名）
      useLlmExtraction: true
